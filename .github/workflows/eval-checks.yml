name: Eval Checks

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  eval-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parse real-project JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path("eval/real-projects").rglob("*.json")):
              with path.open("r", encoding="utf-8") as f:
                  json.load(f)
              print(path)
          PY

      - name: Validate real-project matrix
        run: python eval/real-projects/scripts/validate_real_projects.py

      - name: Run impact validator tests
        run: python skills/impact/tests/test_scripts/test_impact_validate.py

      - name: Run pathfinder validator tests
        run: python skills/pathfinder/tests/test_scripts/test_pathfinder_scripts.py

      - name: Run delivery checker tests
        run: python -m unittest discover -s eval/real-projects/tests -p "test_*.py"

      - name: Install CI dependencies
        run: pip install pyyaml pytest

      - name: Run IntentAnchor validator tests
        run: python skills/intent-anchor/tests/test_intent_validate.py

      - name: Run intent-chain validator tests (prd / design / visual / issues / dev / adversarial / verify)
        run: >-
          python -m pytest -q
          skills/intent-prd/tests
          skills/intent-design/tests
          skills/intent-visual/tests
          skills/intent-issues/tests
          skills/intent-dev/tests
          skills/intent-adversarial/tests
          skills/intent-verify/tests

      - name: Run impact V25 regression tests
        run: python -m pytest -q skills/impact/tests/test_scripts/test_v25_regression.py

      - name: Check every validator skill has tests visible to git
        run: python tests/test_skill_tests_tracked.py

      - name: Check intent-chain order is the same in every doc
        run: python tests/test_chain_order_consistency.py

      - name: Run shared chain validator tests (_common)
        run: python -m unittest discover -s skills/_common/tests -p "test_*.py"

      - name: Run shared Skill improvement prompt tests
        run: python tests/test_skill_improvement_prompt.py

      # run.sh 的场景检查要用两个开源项目当 fixture，test-projects/ 不入库，这里按场景 JSON 里
      # fixture.commit 固定的版本取下来。改了场景里的 commit，这两步的 ref 要一起改。
      - name: Check out RuoYi-Vue fixture
        uses: actions/checkout@v4
        with:
          repository: yangzongzhuan/RuoYi-Vue
          ref: 41720e624c5a668c7d3777835e4c87095a7a1dfd
          path: test-projects/ruoyi-vue
          persist-credentials: false

      - name: Check out go-admin fixture
        uses: actions/checkout@v4
        with:
          repository: go-admin-team/go-admin
          ref: b83eef8670b09533213cdd29635e01842704ddd8
          path: test-projects/go-admin
          persist-credentials: false

      - name: Run tests/run.sh scripts
        run: |
          for dir in skills/*/tests; do
            if [ -f "$dir/run.sh" ]; then
              echo "Running $dir/run.sh"
              bash "$dir/run.sh" || exit 1
            fi
          done

      - name: Check template sync
        run: python scripts/sync_templates.py --check

      - name: Validate skill metadata
        run: |
          python - <<'PY'
          import re, sys, yaml
          from pathlib import Path
          errors = []
          for skill_md in sorted(Path("skills").rglob("SKILL.md")):
              text = skill_md.read_text(encoding="utf-8")
              if not text.startswith("---"):
                  errors.append(f"{skill_md}: missing frontmatter")
                  continue
              end = text.find("---", 3)
              if end == -1:
                  errors.append(f"{skill_md}: unclosed frontmatter")
                  continue
              try:
                  meta = yaml.safe_load(text[3:end])
              except Exception as e:
                  errors.append(f"{skill_md}: invalid YAML: {e}")
                  continue
              for field in ("name", "description", "allowed-tools"):
                  if field not in meta:
                      errors.append(f"{skill_md}: missing '{field}' in frontmatter")
          if errors:
              for e in errors:
                  print(f"ERROR: {e}")
              sys.exit(1)
          print("All skill metadata valid")
          PY
