<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<style>
/* ===== 言镜单一视觉体系（templates/DESIGN.md v3.0）：冷纸白 + 墨 + 青色，克制编辑感 ===== */
:root {
  --paper: #F7F8F7;
  --surface: #FFFFFF;
  --soft: #EEF1EF;
  --line: #E2E6E3;
  --ink: #16181A;
  --body: #4A4E4B;
  --muted: #878C88;
  --muted-soft: #A0A5A1;
  --accent: #0F766E;
  --accent-deep: #0B5F58;
  --accent-soft: #E6F0EE;
  --spectrum: linear-gradient(90deg, #F97316, #EC4899, #8B5CF6, #3B82F6);
  --stalled: #C03E3A; --cooling: #BF8228; --waiting: #10B981; --done: #0F766E;
  --font-display: 'Songti SC','Noto Serif SC','Source Han Serif SC',SimSun,Georgia,serif;
  --font-body: -apple-system,'SF Pro Display','PingFang SC','HarmonyOS Sans SC','MiSans','Segoe UI','Microsoft YaHei',sans-serif;
  --font-mono: 'JetBrains Mono','SF Mono',Consolas,'Cascadia Code',ui-monospace,monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--paper); color: var(--body);
  font-family: var(--font-body); font-size: 16px; line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

.shell { max-width: 1040px; margin: 0 auto; padding: 34px 40px 0; }

/* 顶部铭牌 */
.topbar { display: flex; align-items: center; gap: 11px; margin-bottom: 84px; }
.logo-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.wordmark {
  font-family: var(--font-display); font-size: 21px; letter-spacing: 6px;
  color: var(--ink); text-decoration: none; font-weight: 600;
}
.wm-sub {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 2px;
  color: var(--muted); text-transform: uppercase;
}

/* 眉标 */
.eyebrow {
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 3px;
  color: var(--muted); text-transform: uppercase; margin-bottom: 20px;
}
.eyebrow b { color: var(--accent); font-weight: 600; }
.eyebrow .dot { color: var(--accent); }

/* 标题 */
h1.display {
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(40px, 6.5vw, 72px);
  line-height: 1.12; letter-spacing: 1px; color: var(--ink); margin-bottom: 0;
}
h1.display .accent { color: var(--accent); }

h2 {
  font-family: var(--font-display); font-size: 28px; font-weight: 700;
  color: var(--ink); letter-spacing: 1px; margin: 72px 0 24px;
}
h3 { font-size: 18px; font-weight: 600; color: var(--ink); margin: 40px 0 14px; }
p { margin-bottom: 14px; }
strong { color: var(--ink); font-weight: 600; }
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-deep); }

/* 签名：全页唯一光谱 */
.refract {
  width: 180px; height: 3px; border: none; border-radius: 2px;
  background: var(--spectrum); margin: 30px 0 26px;
}

/* 卡片与色带 */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 4px; padding: 24px 26px; margin: 18px 0;
}
.band {
  background: var(--soft); border-radius: 4px; padding: 22px 26px; margin: 18px 0;
}

/* 引文块：灵魂组件 */
.quote { border-left: 3px solid var(--accent); padding: 4px 0 4px 18px; margin: 22px 0; }
.quote .q-eyebrow {
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 1.5px;
  color: var(--muted); display: block; margin-bottom: 6px;
}
.quote .q-text {
  font-family: var(--font-display); font-size: 16px; color: var(--ink);
}

/* 大数字带（编辑式横条） */
.stats {
  display: grid; grid-template-columns: repeat(4, 1fr);
  margin-top: 64px;
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
}
.stat { padding: 26px 22px 24px 0; border-left: 1px solid var(--line); }
.stat:first-child { border-left: none; }
.stat .n {
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(34px, 4.2vw, 52px); line-height: 1; color: var(--ink); letter-spacing: -1px;
}
.stat .note { margin-top: 12px; font-size: 13px; color: var(--muted); }

/* 数字块（旧 .bignum 兼容） */
.bignum-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin: 28px 0; }
.bignum {
  background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 22px 24px;
}
.bignum .n {
  font-family: var(--font-display); font-weight: 700; font-size: 40px;
  color: var(--ink); letter-spacing: -1px; line-height: 1.1;
}
.bignum .note { font-size: 13px; color: var(--muted); margin-top: 8px; }

/* 药丸 */
.pill {
  display: inline-block; padding: 1px 12px; border-radius: 999px;
  font-size: 13px; line-height: 1.7; margin: 0 6px 6px 0;
  background: var(--soft); color: var(--ink);
}
.pill.red { color: var(--stalled); } .pill.amber { color: var(--cooling); }
.pill.green { color: var(--waiting); } .pill.gray { color: var(--muted-soft); }

/* 表格 */
table { width: 100%; border-collapse: collapse; margin: 22px 0; font-size: 15px; }
th { font-weight: 600; color: var(--muted); text-align: left; padding: 8px 12px;
     border-bottom: 1px solid var(--line); font-size: 13px; }
td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.mono, .mono { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }

/* 列表 */
ul { list-style: none; margin: 16px 0; }
li { padding-left: 20px; position: relative; margin-bottom: 12px; }
li::before { content: '·'; color: var(--accent); position: absolute; left: 4px; font-weight: 700; }
ol { margin: 16px 0; padding-left: 0; list-style: none; counter-reset: wm-ol; }
ol li { padding-left: 34px; counter-increment: wm-ol; }
ol li::before { content: counter(wm-ol); left: 0; font-family: var(--font-mono); font-size: 13px; color: var(--accent); }

/* 提醒卡 */
.insight-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 24px; }
.insight-card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 4px; padding: 24px 24px 20px;
}
.insight-type {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 2px;
  color: var(--accent); text-transform: uppercase;
}
.insight-fact {
  margin-top: 12px; font-family: var(--font-display); font-size: 18px;
  line-height: 1.6; color: var(--ink); font-weight: 600;
}
.insight-quote { margin-top: 16px; padding: 2px 0 2px 13px; border-left: 2px solid var(--accent); }
.insight-quote .date {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 1px; color: var(--muted);
}
.insight-quote .txt {
  margin-top: 4px; font-family: var(--font-display); font-size: 14px; color: var(--body); line-height: 1.6;
}
.insight-quote-main { margin-top: 14px; padding: 16px 18px 14px; background: var(--accent-soft); border-radius: 3px; }
.insight-quote-main .date { font-family: var(--font-mono); font-size: 11px; letter-spacing: 1px; color: var(--accent-deep); }
.insight-quote-main .txt { margin-top: 6px; font-family: var(--font-display); font-size: 18px; color: var(--ink); line-height: 1.7; }
.insight-fact { margin-top: 16px; }

/* 说 vs 做条 */
.gap-bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; margin-top: 22px; background: var(--soft); }
.gap-bar span { height: 100%; }
.gap-bar .done { background: var(--done); }
.gap-bar .cool { background: var(--cooling); }
.gap-bar .stall { background: var(--stalled); }
.gap-legend { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 12px; font-size: 13px; color: var(--muted); }
.gap-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; }

/* 导航卡 */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(186px, 1fr)); gap: 14px; margin-top: 24px; }
.nav-card {
  display: block; text-decoration: none;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 4px; padding: 20px 20px 18px; color: var(--ink);
  transition: border-color .15s ease, transform .15s ease;
}
.nav-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.nav-card .idx { font-family: var(--font-mono); font-size: 11px; letter-spacing: 1px; color: var(--muted); }
.nav-card h3 { font-family: var(--font-display); font-size: 18px; font-weight: 600; margin: 10px 0 6px; color: var(--ink); }
.nav-card p { font-size: 13px; color: var(--muted); line-height: 1.6; }

/* 工具排名条 + agent 卡 */
.rank-row {
  display: grid; grid-template-columns: 160px 1fr 130px; align-items: center; gap: 16px;
  margin: 12px 0;
}
.rank-name { font-weight: 600; color: var(--ink); text-align: right; }
.rank-track { background: var(--soft); border-radius: 999px; height: 12px; overflow: hidden; }
.rank-fill { background: var(--accent); height: 100%; border-radius: 999px; }
.rank-count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

.agent-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.agent-name { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--ink); }
.agent-meta { font-family: var(--font-mono); font-size: 12px; letter-spacing: 1px; color: var(--muted); }
.agent-props { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 14px; color: var(--body); }
.agent-props .k { color: var(--muted); margin-right: 4px; }
.agent-props .v { font-weight: 600; color: var(--ink); }

/* 时间回望：让原话成为每个阶段的锚点 */
.timeline-intro {
  max-width: 620px; margin: 0 0 56px; color: var(--body); font-family: var(--font-display);
  font-size: 20px; line-height: 1.9;
}
.timeline-chapter {
  position: relative; max-width: 760px; margin: 0 0 64px; padding-left: 28px;
  border-left: 1px solid var(--line);
}
.timeline-chapter-head { display: flex; align-items: baseline; gap: 14px; margin-left: -29px; }
.timeline-chapter-head h2 { margin: 0 0 22px; font-size: 27px; }
.timeline-kicker {
  display: inline-flex; align-items: center; justify-content: center; width: 10px; height: 10px;
  border-radius: 50%; background: var(--accent); color: transparent; flex: 0 0 auto;
  box-shadow: 0 0 0 5px var(--paper);
}
.timeline-quote { margin: 10px 0 24px; padding-left: 22px; }
.timeline-quote .q-text { display: block; font-size: clamp(20px, 3vw, 28px); line-height: 1.65; }
.timeline-note { max-width: 680px; font-size: 16px; line-height: 1.85; }
.timeline-note p { margin-bottom: 10px; }
.timeline-echo {
  display: flex; gap: 18px; align-items: baseline; margin-top: 12px; padding: 12px 16px;
  background: var(--soft); border-radius: 3px; color: var(--body); font-family: var(--font-display);
}
.timeline-echo .mono { flex: 0 0 auto; }

/* 白话回望卡：不同关系使用不同阅读节奏 */
.facing-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 12px 0 20px; }
.facing-col { background: var(--surface); border: 1px solid var(--line); padding: 18px 20px 8px; }
.facing-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 2px; color: var(--accent); margin-bottom: 4px; }
.facing-col .timeline-quote { border-left: 0; padding-left: 0; margin: 8px 0 12px; }
.facing-col .timeline-quote .q-text { font-size: 18px; }
.timeline-turning .timeline-quote .q-text, .timeline-now .timeline-quote .q-text { font-size: clamp(22px, 3.5vw, 32px); }
.follow { position: relative; margin: 22px 0 8px 8px; padding-left: 22px; border-left: 1px solid var(--accent-soft); }
.follow-node { position: relative; display: grid; grid-template-columns: 108px 1fr; gap: 14px; padding: 0 0 18px; }
.follow-node::before { content: ''; position: absolute; left: -27px; top: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--paper); }
.timeline-setaside { background: color-mix(in srgb, var(--soft) 52%, transparent); padding: 4px 24px 22px; border-left-color: var(--muted-soft); }
.timeline-setaside .timeline-quote .q-text { color: var(--body); }
.timeline-now { border-left-color: var(--accent); }
.timeline-now .timeline-chapter-head h2 { color: var(--accent-deep); }
.timeline-persistent .timeline-echo { margin-left: 0; }

/* AI 视角卡：AI 的话是观察，不是判词 */
.task-section { max-width: 860px; margin: 0 0 58px; padding: 0 0 28px 28px; border-left: 1px solid var(--line); }
.task-section h2 { margin-top: 0; }
.task-quotes { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.task-quotes .agent-quote { background: var(--surface); border: 1px solid var(--line); padding: 18px 20px; margin: 0; }
.task-quotes .agent-quote .q-text { font-size: 17px; }
.agent-section { max-width: 860px; margin: 0 0 58px; padding: 0 0 28px 28px; border-left: 1px solid var(--line); }
.agent-section h2 { margin-top: 0; }
.agent-scene { background: var(--surface); border: 1px solid var(--line); padding: 8px 22px 14px; margin: 14px 0; }
.agent-scene-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 1.5px; color: var(--accent); margin-top: 8px; }
.agent-quote { margin: 12px 0 4px; }
.agent-quote .q-text { font-size: 18px; }
.agent-facing .facing-col .agent-quote { border-left: 0; padding-left: 0; }
.agent-facing .facing-col .agent-quote .q-text { font-size: 17px; }
.agent-shared { background: linear-gradient(90deg, var(--accent-soft), transparent 72%); }
.agent-now { border-left-color: var(--accent); }
.agent-now .timeline-chapter-head h2 { color: var(--accent-deep); }
.build-agents-rank { opacity: .68; }

/* AI 视角卡：AI 的话是观察，不是判词 */
.ai-view-section { max-width: 820px; margin: 0 0 58px; padding: 0 0 26px 28px; border-left: 1px solid var(--line); }
.ai-view-section h2 { margin-top: 0; }
.ai-quote { margin-top: 16px; }
.ai-quote .q-text { font-size: 19px; }
.ai-facing .facing-col .ai-quote { border-left: 0; padding-left: 0; }
.ai-facing .facing-col .ai-quote .q-text { font-size: 17px; }
.ai-mistake { border-left-color: var(--muted-soft); }
.ai-mistake .facing-label { color: var(--muted); }
.ai-now { border-left-color: var(--accent); background: linear-gradient(90deg, var(--accent-soft), transparent 70%); padding: 0 28px 28px; }
.ai-now .q-text { font-size: clamp(22px, 3vw, 30px); }

/* 承诺回望卡：显示账本事实，不把未完成变成评分 */
.section-lead { color: var(--muted); max-width: 620px; margin-top: -12px; }
.promise-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; margin: 20px 0 38px; }
.promise-card { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--accent); padding: 20px 22px 18px; }
.promise-card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.promise-status { font-family: var(--font-mono); font-size: 11px; color: var(--accent); letter-spacing: 1px; }
.promise-text { margin: 22px 0 18px; font-family: var(--font-display); font-size: 19px; line-height: 1.7; color: var(--ink); }
.promise-meta { border-top: 1px solid var(--line); padding-top: 10px; color: var(--muted); font-size: 12px; }

/* 落款 */
.colophon {
  margin-top: 84px; padding: 26px 0 46px; border-top: 1px solid var(--line);
  font-size: 13px; color: var(--muted); text-align: center;
}

@media (max-width: 820px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .insight-grid { grid-template-columns: 1fr; }
  .shell { padding: 26px 22px 0; }
}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar"><span class="logo-dot"></span><a class="wordmark" href="__HOME__">言镜</a><span class="wm-sub">wordmirror</span></div>
  <div class="eyebrow">__EYEBROW__</div>
  __BODY__
  <div class="colophon">言镜 · 数据只存在你自己的电脑上</div>
</div>
</body>
</html>
