<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<style>
/* ===== 言镜视觉体系 v7.0：单页平台风（基准 developers.openai.com） =====
   纯白底 · 黑白灰层级 · 绿色只做 3px 状态点 · 无渐变无图片 · 两种卡片 */
:root {
  --bg: #FFFFFF;
  --surface: #F9F9F9;
  --surface-2: #F1F1F2;
  --fg: #0D0D0D;
  --fg-soft: #404046;
  --muted: #6E6E74;
  --faint: #9B9BA1;
  --border: #EBEBED;
  --accent: #10A37F;   /* 仅 3px 状态点 */
  --font-display: -apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI Variable','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-body: -apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI Variable','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-mono: ui-monospace,'SF Mono','Cascadia Mono','JetBrains Mono',Consolas,'Segoe UI Mono',monospace;
  --nav-h: 3.75rem;
  --r-lg: 16px;
  --r-md: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  background: var(--bg); color: var(--fg-soft);
  font-family: var(--font-body); font-size: 15.5px; line-height: 1.7;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
::selection { background: var(--fg); color: #fff; }
a { color: inherit; text-decoration: none; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; border-radius: 6px; }
.skip-link {
  position: fixed; top: .75rem; left: .75rem; z-index: 200;
  padding: .55rem .9rem; background: var(--fg); color: #fff;
  font: 600 .82rem/1 var(--font-mono); border-radius: 8px;
  transform: translateY(-200%);
}
.skip-link:focus { transform: translateY(0); }
.tnum { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

/* ============ 导航 ============ */
.nav {
  position: sticky; top: 0; z-index: 100; height: var(--nav-h);
  background: rgba(255,255,255,.88);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.nav .inner {
  max-width: 1200px; margin-inline: auto; height: 100%;
  padding-inline: var(--edge, 2rem);
  display: flex; align-items: center; gap: 1.25rem;
}
:root { --edge: clamp(1.25rem, 4vw, 2.5rem); }
.brand { display: flex; align-items: center; gap: .55rem; margin-right: auto; }
.brand .name { font-family: var(--font-display); font-weight: 600; letter-spacing: -.01em; font-size: 1rem; color: var(--fg); }
.brand .name small { font-weight: 500; color: var(--faint); margin-left: .35rem; }
.nav-links { display: flex; align-items: center; gap: .15rem; font-size: .9rem; }
.nav-links a { color: var(--muted); padding: .4rem .75rem; border-radius: 999px; transition: color .15s ease, background .15s ease; white-space: nowrap; }
.nav-links a:hover { color: var(--fg); background: var(--surface); }
.nav-links a[aria-current="true"] { color: var(--fg); font-weight: 550; background: var(--surface-2); }
.nav-cta {
  display: inline-flex; align-items: center; gap: .45rem;
  background: var(--fg); color: #fff;
  font-size: .85rem; font-weight: 600;
  padding: .5rem 1rem; border-radius: 999px; white-space: nowrap;
  transition: opacity .15s ease;
}
.nav-cta:hover { opacity: .85; }
.nav-cta i { font-style: normal; font-size: .75rem; }

main { max-width: 1200px; margin-inline: auto; padding: 0 var(--edge); }

/* ============ Hero（居中，全页唯一居中区） ============ */
.hero { padding: clamp(3rem, 7vh, 4.5rem) 0 clamp(2.2rem, 4vh, 3rem); text-align: center; }
.hero h1 {
  font-family: var(--font-display); font-weight: 600;
  font-size: clamp(1.9rem, 3.4vw, 2.75rem);
  letter-spacing: -.03em; line-height: 1.12; color: var(--fg);
}
.hero .hero-lede { margin: 1rem auto 0; max-width: 52ch; color: var(--muted); font-size: 1.02rem; line-height: 1.75; }
.hero .lede { margin: 1rem auto 0; max-width: 52ch; color: var(--muted); font-size: 1.02rem; line-height: 1.75; }
.stat-band {
  margin: clamp(2rem, 5vh, 3rem) auto 0; max-width: 880px;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-lg);
  overflow: hidden; text-align: left;
}
.stat-band .cell { padding: 1.15rem 1.4rem; border-left: 1px solid var(--border); }
.stat-band .cell:first-child { border-left: none; }
.stat-band .v { font-family: var(--font-display); font-weight: 600; font-size: 1.75rem; letter-spacing: -.02em; line-height: 1.1; color: var(--fg); }
.stat-band .v small { font-size: .55em; color: var(--faint); font-weight: 500; margin-left: .15rem; }
.stat-band .k { margin-top: .3rem; font-size: .85rem; color: var(--muted); }

/* ============ 双栏骨架 ============ */
.layout {
  display: grid; grid-template-columns: minmax(0, 1fr) 19rem;
  gap: clamp(2rem, 3.5vw, 3.5rem); align-items: start;
}
.main-col { min-width: 0; display: flex; flex-direction: column; gap: clamp(3.2rem, 7vh, 5rem); padding: 1rem 0 4.5rem; }
.rail { position: sticky; top: calc(var(--nav-h) + 1.5rem); display: flex; flex-direction: column; gap: 1rem; padding-top: 1rem; }

/* ============ 分节 ============ */
/* B 方案：节 = 超大圆角色块，奇偶灰/白交替，给长页做视觉换气 */
.sec {
  border-radius: 24px;
  padding: clamp(1.8rem, 3.5vw, 2.8rem);
  scroll-margin-top: calc(var(--nav-h) + 1rem);
}
.sec.tone-gray { background: var(--surface); }
.sec.tone-white { background: transparent; }
/* 灰底节内的反转：灰卡→白底（含边框），保证两层不糊 */
.tone-gray .band, .tone-gray .note-card, .tone-gray .insight-card,
.tone-gray .facing-col, .tone-gray .line-hook, .tone-gray .idx-callout,
.tone-gray .bignum, .tone-gray .step-card, .tone-gray .mirror,
.tone-gray .obs, .tone-gray .pill, .tone-gray .badge,
.tone-gray .rank-track, .tone-gray .agent-name, .tone-gray .gap-bar {
  background: var(--bg);
}
.tone-gray .badge-drop { background: var(--bg); border: 1px solid var(--border); }
.tone-gray .insight-quote { border-left-color: rgba(13,13,13,.12); }
.tone-gray .insight-quote-main { border-left-color: var(--fg); }
/* 灰底节内的分隔线加深一档（#EBEBED 在 #F9F9F9 上几乎不可见） */
.tone-gray .promise-card, .tone-gray .agent-scene, .tone-gray .status-item,
.tone-gray .rank-item, .tone-gray .timeline-echo, .tone-gray .idx-callout,
.tone-gray .prom { border-top-color: rgba(13,13,13,.09); }
.tone-gray .agent-field, .tone-gray .where-row, .tone-gray table td, .tone-gray table th { border-top-color: rgba(13,13,13,.09); border-bottom-color: rgba(13,13,13,.09); }
.tone-gray .follow-node::before { box-shadow: 0 0 0 3px var(--surface); }
/* 灰底节内的弱色文字加深，保对比度 */
.tone-gray .sec-eyebrow, .tone-gray .mono, .tone-gray td.mono,
.tone-gray .q-eyebrow, .tone-gray .when, .tone-gray .promise-meta,
.tone-gray .rank-count, .tone-gray .agent-field-label, .tone-gray cite,
.tone-gray .insight-type, .tone-gray .facing-label, .tone-gray .note-head { color: var(--muted); }
.tone-gray .section-lead, .tone-gray .timeline-note, .tone-gray .d,
.tone-gray .idx-callout p, .tone-gray .rail-note { color: var(--fg-soft); }
.sec-eyebrow { font-family: var(--font-mono); font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-bottom: .6rem; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.4rem, 2.4vw, 1.8rem); letter-spacing: -.02em; line-height: 1.2; color: var(--fg); margin-bottom: .5rem; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; letter-spacing: -.01em; color: var(--fg); margin: 1.6rem 0 .6rem; }
h4 { font-family: var(--font-display); font-weight: 600; font-size: .95rem; letter-spacing: -.01em; color: var(--fg); margin: 1.2rem 0 .5rem; }
.section-lead { color: var(--muted); font-size: .98rem; max-width: 56ch; line-height: 1.7; margin-bottom: 1.3rem; }
h2 + p:not(.section-lead) { color: var(--muted); }

/* 两种卡片 */
.card-gray { background: var(--surface); border-radius: var(--r-lg); }
.card-line { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-lg); }

/* ============ 正文元素 ============ */
p { margin-bottom: 14px; }
strong { color: var(--fg); font-weight: 600; }
h2 + p:not(.band):not(.section-lead) { color: var(--muted); }

ul { list-style: none; margin: 14px 0; }
li { padding-left: 18px; position: relative; margin-bottom: 10px; }
li::before { content: '·'; color: var(--fg); position: absolute; left: 4px; font-weight: 700; }
ol { margin: 14px 0; padding-left: 0; list-style: none; counter-reset: wm-ol; }
ol li { padding-left: 30px; counter-increment: wm-ol; }
ol li::before { content: counter(wm-ol); left: 0; font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }

table { width: 100%; border-collapse: collapse; margin: 18px 0; font-size: .92rem; }
th { font-weight: 600; color: var(--faint); text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: .8rem; }
td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
td.mono, .mono { font-family: var(--font-mono); font-size: .8rem; color: var(--faint); }

/* 提示条 / 落款卡：灰底圆角 */
.band { background: var(--surface); border-radius: var(--r-lg); padding: 1.1rem 1.3rem; margin: 18px 0; }
.band p { margin: 0; color: var(--muted); }
.band strong { color: var(--fg); }

/* 给现在的你：灰底 featured 卡 */
.note-card { background: var(--surface); border-radius: var(--r-lg); padding: 1.5rem 1.6rem; margin: 0 0 2rem; }
.note-head { font-family: var(--font-mono); font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-bottom: .8rem; }
.note-card p { font-size: 1rem; line-height: 1.75; color: var(--fg-soft); }
.note-card strong { color: var(--fg); }

/* 你现在站在哪里：白卡键值行 */
.where-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 1.3rem 1.5rem; margin: 0 0 1.8rem; }
.where-head { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; color: var(--fg); margin-bottom: .8rem; }
.where-row { display: grid; grid-template-columns: 104px 1fr; gap: 18px; padding: 10px 0; border-top: 1px solid var(--border); }
.where-row:first-of-type { border-top: none; }
.where-label { font-family: var(--font-mono); font-size: .74rem; color: var(--faint); padding-top: 3px; }
.where-val { font-size: .95rem; line-height: 1.7; color: var(--fg); }

/* 引文块：mono 日期眉标 + 墨色引文（无竖线） */
.quote { padding: 2px 0; margin: 16px 0; }
.quote .q-eyebrow { font-family: var(--font-mono); font-size: .76rem; letter-spacing: .06em; color: var(--faint); display: block; margin-bottom: 6px; }
.quote .q-text { font-family: var(--font-display); font-size: clamp(1.15rem, 2vw, 1.45rem); line-height: 1.7; color: var(--fg); font-weight: 550; letter-spacing: -.01em; }

/* 数字：stats 条（页面内嵌版，如 AI 工具统计） */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); margin: 22px 0; border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; background: var(--bg); }
.stat { padding: 1.05rem 1.3rem; border-left: 1px solid var(--border); }
.stat:first-child { border-left: none; }
.stat .n { font-family: var(--font-display); font-weight: 600; font-size: 1.5rem; letter-spacing: -.02em; line-height: 1.1; color: var(--fg); }
.stat .note { margin-top: 6px; font-size: .82rem; color: var(--muted); }
.bignum-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin: 20px 0; }
.bignum { background: var(--surface); border-radius: var(--r-lg); padding: 1.1rem 1.2rem; }
.bignum .n { font-family: var(--font-display); font-weight: 600; font-size: 1.5rem; color: var(--fg); letter-spacing: -.02em; line-height: 1.1; }
.bignum .note { font-size: .82rem; color: var(--muted); margin-top: 5px; }

/* 药丸 */
.pill { display: inline-block; padding: 1px 12px; border-radius: 999px; font-size: .82rem; line-height: 1.7; margin: 0 6px 6px 0; background: var(--surface); color: var(--fg-soft); }
.pill.red, .pill.amber, .pill.green, .pill.gray { color: var(--fg-soft); }

/* 徽章：全中性 */
.badge { display: inline-block; font-size: .78rem; font-weight: 550; letter-spacing: .01em; padding: .28rem .72rem; border-radius: 999px; margin-left: 10px; vertical-align: middle; white-space: nowrap; }
.badge-live { background: var(--surface); color: var(--fg); }
.badge-live::before { content: ''; display: inline-block; width: .36rem; height: .36rem; border-radius: 50%; background: var(--accent); margin-right: .4rem; vertical-align: 1px; }
.badge-done { background: var(--surface-2); color: var(--muted); }
.badge-drop { background: var(--bg); color: var(--faint); border: 1px solid var(--border); }

/* 提醒卡 */
.insight-grid { display: flex; flex-direction: column; gap: .9rem; margin-top: 20px; }
.insight-card { background: var(--surface); border-radius: var(--r-lg); padding: 1.3rem 1.5rem; max-width: 760px; }
.insight-type { font-family: var(--font-mono); font-size: .74rem; letter-spacing: .08em; color: var(--muted); text-transform: none; }
.insight-type::before { content: ''; display: inline-block; width: .36rem; height: .36rem; border-radius: 50%; background: var(--accent); margin-right: .5rem; vertical-align: 2px; }
.insight-fact { margin-top: 12px; font-family: var(--font-display); font-size: 1.15rem; line-height: 1.6; color: var(--fg); font-weight: 550; letter-spacing: -.01em; }
.insight-quote { margin-top: 14px; padding: 2px 0 2px 14px; border-left: 2px solid var(--border); }
.insight-quote .date { font-family: var(--font-mono); font-size: .74rem; color: var(--faint); }
.insight-quote .txt { margin-top: 4px; font-size: .92rem; color: var(--muted); line-height: 1.65; }
.insight-quote-main { margin-top: 14px; padding: 2px 0 2px 14px; border-left: 2px solid var(--fg); }
.insight-quote-main .date { font-family: var(--font-mono); font-size: .74rem; color: var(--muted); }
.insight-quote-main .txt { margin-top: 5px; font-family: var(--font-display); font-size: 1.08rem; color: var(--fg); line-height: 1.65; letter-spacing: -.01em; }

/* 说 vs 做条：墨色系 */
.gap-bar { display: flex; height: 6px; border-radius: 999px; overflow: hidden; margin-top: 18px; background: var(--surface-2); }
.gap-bar span { height: 100%; }
.gap-bar .done { background: var(--fg); }
.gap-bar .cool { background: #B5B5BA; }
.gap-bar .stall { background: #DDDDE0; }
.gap-legend { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 10px; font-size: .82rem; color: var(--muted); }
.gap-legend i { display: inline-block; width: .5rem; height: .5rem; border-radius: 50%; margin-right: 6px; background: var(--surface-2); border: 1px solid var(--border); }

/* 工具排行条 */
.rank-item { margin: 0; padding: .7rem 0; border-top: 1px solid var(--border); }
.rank-item:first-of-type { border-top: none; }
.rank-row { display: grid; grid-template-columns: 150px 1fr 120px; align-items: center; gap: 16px; }
.rank-name { font-weight: 600; color: var(--fg); text-align: right; font-size: .92rem; }
.rank-track { background: var(--surface-2); border-radius: 999px; height: 8px; overflow: hidden; }
.rank-fill { background: var(--fg); height: 100%; border-radius: 999px; }
.rank-count { font-family: var(--font-mono); font-size: .78rem; color: var(--faint); }
.rank-note { margin: 4px 166px 6px 0; font-size: .85rem; line-height: 1.65; color: var(--muted); }

/* 时间线（02/06 通用） */
.timeline-chapter { position: relative; max-width: 780px; margin: 0 0 2.6rem; padding-left: 34px; border-left: 1px solid var(--border); }
.timeline-chapter-head { display: flex; align-items: baseline; gap: 14px; margin-left: -35px; }
.timeline-chapter-head h2 { margin: 0 0 18px; font-size: clamp(1.3rem, 2.2vw, 1.6rem); }
.timeline-kicker { width: .55rem; height: .55rem; border-radius: 50%; background: var(--fg); color: transparent; flex: 0 0 auto; box-shadow: 0 0 0 4px var(--bg); }
.timeline-quote { margin: 10px 0 20px; }
.timeline-quote .q-text { font-size: clamp(1.15rem, 2vw, 1.4rem); }
.timeline-note { max-width: 640px; font-size: .95rem; line-height: 1.8; color: var(--muted); }
.timeline-note p { margin-bottom: 10px; }
.timeline-echo { display: flex; gap: 16px; align-items: baseline; margin-top: 12px; padding: 12px 0 0; border-top: 1px solid var(--border); color: var(--fg-soft); font-size: .92rem; }
.timeline-echo .mono { flex: 0 0 auto; }
.line-hook { margin-top: 14px; padding: 12px 16px; background: var(--surface); border-radius: var(--r-md); font-size: .93rem; line-height: 1.7; color: var(--fg); max-width: 640px; }

/* 双栏对照 / 后续节点 */
.facing-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 12px 0 16px; }
.facing-col { background: var(--surface); border-radius: var(--r-lg); padding: 1.1rem 1.2rem 8px; }
.facing-label { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .08em; color: var(--faint); margin-bottom: 4px; }
.facing-col .timeline-quote { margin: 6px 0 10px; }
.facing-col .timeline-quote .q-text { font-size: 1.02rem; }
.follow { margin: 16px 0 6px; }
.follow-node { position: relative; display: grid; grid-template-columns: 104px 1fr; gap: 14px; padding: 0 0 12px 20px; }
.follow-node::before { content: ''; position: absolute; left: 0; top: 7px; width: .5rem; height: .5rem; border-radius: 50%; background: var(--accent); }
.timeline-setaside { opacity: .72; }
.timeline-now { border-left-color: var(--fg); }
.timeline-now .timeline-chapter-head h2 { color: var(--fg); }
.timeline-turning .timeline-quote .q-text { font-size: clamp(1.2rem, 2.2vw, 1.5rem); }

/* AI 工具卡 */
.agent-section { max-width: 860px; margin: 0 0 3.4rem; }
.agent-section h2 { margin-top: 0; }
.agent-scene { border-top: 1px solid var(--border); padding: 1.4rem 0 1.6rem; margin: 0; }
.agent-scene-label { display: flex; align-items: baseline; gap: 14px; margin: 0 0 14px; flex-wrap: wrap; }
.agent-name { font-family: var(--font-mono); font-size: .74rem; font-weight: 600; letter-spacing: .08em; color: var(--fg); background: var(--surface); padding: 4px 10px; border-radius: 6px; white-space: nowrap; }
.agent-tagline { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; color: var(--fg); letter-spacing: -.01em; }
.agent-field { display: grid; grid-template-columns: 110px 1fr; gap: 16px; padding: 8px 0; border-top: 1px solid var(--border); max-width: 720px; }
.agent-field-label { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .08em; color: var(--faint); padding-top: 3px; }
.agent-field-value { font-size: .92rem; line-height: 1.75; color: var(--fg-soft); }
.agent-field-plain { padding: 8px 0; font-size: .92rem; line-height: 1.75; color: var(--fg-soft); }
.agent-quote { margin: 16px 0 0; }
.agent-quote .q-text { font-size: 1.1rem; }
.ai-view-section { max-width: 780px; margin: 0 0 2.6rem; padding: 0 0 1.4rem 26px; border-left: 1px solid var(--border); }
.ai-view-section h2 { margin-top: 0; }
.ai-quote { margin-top: 14px; }
.ai-quote .q-text { font-size: 1.05rem; }
.ai-mistake .facing-label { color: var(--faint); }
.ai-now, .agent-now { border-left-color: var(--fg); }
.build-agents-rank { margin: 18px 0 26px; }

/* 说过要做的事 */
.promise-grid { display: block; margin: 0 0 2rem; max-width: 860px; }
.promise-card { border-top: 1px solid var(--border); padding: 1.1rem 0 1.2rem; }
.promise-card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.promise-status { margin-left: 0; }
.promise-status.badge { margin-left: 0; }
.promise-text { margin: 10px 0 8px; font-family: var(--font-display); font-size: 1.12rem; line-height: 1.55; color: var(--fg); font-weight: 550; letter-spacing: -.01em; max-width: 700px; }
.promise-meta { color: var(--faint); font-size: .8rem; font-family: var(--font-mono); }

/* 页脚 */
.colophon {
  margin-top: 84px; padding: 24px 0 44px; border-top: 1px solid var(--border);
  font-size: .84rem; color: var(--faint); text-align: left;
  display: flex; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap;
}
.colophon b { color: var(--fg-soft); font-weight: 600; }

/* 导航卡（首页"翻开更多"→ 本页锚点，v7 用于节锚） */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin-top: 22px; }
.nav-card {
  display: block; background: var(--surface); border-radius: var(--r-lg);
  padding: 1.1rem 1.1rem 1rem; color: var(--fg);
  transition: background .15s ease;
}
.nav-card:hover { background: var(--surface-2); }
.nav-card .idx { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .06em; color: var(--faint); }
.nav-card h3 { font-size: 1rem; margin: 8px 0 5px; }
.nav-card p { font-size: .82rem; color: var(--muted); line-height: 1.6; margin: 0; }

/* 页面节 slug 专属微调（数据驱动，等价 v6 的 page-* 体系） */
.page-portrait .where-card { max-width: 780px; }
.page-insights .insight-card:not(:first-child) { opacity: .78; }

/* ============ 右栏 ============ */
.panel { background: var(--surface); border-radius: var(--r-lg); padding: 1.2rem 1.3rem; }
.panel-head { font-size: .8rem; font-weight: 600; color: var(--faint); letter-spacing: .02em; display: flex; align-items: center; justify-content: space-between; margin-bottom: .7rem; }
.panel-head .live { font-size: .72rem; font-weight: 500; color: var(--fg-soft); display: flex; align-items: center; gap: .35rem; }
.panel-head .live i { width: .38rem; height: .38rem; border-radius: 50%; background: var(--accent); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
.status-item { display: flex; gap: .7rem; align-items: flex-start; padding: .6rem 0; }
.status-item + .status-item { border-top: 1px solid var(--border); }
.status-item .mark { width: 1.1rem; text-align: center; color: var(--fg); font-size: .8rem; line-height: 1.6; flex: none; }
.status-item .t { font-size: .88rem; font-weight: 550; color: var(--fg); line-height: 1.5; }
.status-item .d { font-size: .79rem; color: var(--muted); line-height: 1.5; margin-top: .08rem; }
.rail-nav { display: flex; flex-direction: column; }
.rail-nav a { display: flex; align-items: baseline; gap: .65rem; padding: .48rem .5rem; color: var(--muted); font-size: .87rem; border-radius: 8px; transition: color .15s ease, background .15s ease; }
.rail-nav a .no { font-family: var(--font-mono); color: var(--faint); font-size: .72rem; width: 1.4rem; flex: none; }
.rail-nav a:hover { color: var(--fg); background: rgba(0,0,0,.035); }
.rail-nav a[aria-current="true"] { color: var(--fg); font-weight: 600; background: rgba(0,0,0,.045); }
.rail-note { font-size: .78rem; color: var(--faint); line-height: 1.7; padding: .15rem .3rem; }

/* ============ 动画 ============ */
.reveal { opacity: 0; transform: translateY(10px); transition: opacity .55s ease, transform .55s ease; }
.reveal.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
  .panel-head .live i { animation: none; }
}

/* ============ 响应式 ============ */
@media (max-width: 1080px) {
  .layout { grid-template-columns: 1fr; gap: 2rem; }
  .rail { position: static; order: 2; padding-top: 0; }
  .main-col { order: 1; padding-top: 0; }
}
@media (max-width: 760px) {
  .nav-links { display: none; }
  .idx-grid, .obs-grid, .steps { grid-template-columns: 1fr; }
  .stats { grid-template-columns: 1fr 1fr; }
  .stat:nth-child(3) { border-left: none; }
  .stat { border-top: 1px solid var(--border); }
  .stat:nth-child(-n+2) { border-top: none; }
  .facing-row { grid-template-columns: 1fr; }
  .promise-card { display: block; }
  .agent-scene-label { flex-wrap: wrap; }
}
@media (max-width: 560px) {
  .nav-cta { display: none; }
  .stat-band { grid-template-columns: 1fr; }
  .stat-band .cell { border-left: none; border-top: 1px solid var(--border); }
  .stat-band .cell:first-child { border-top: none; }
  .hero h1 { font-size: clamp(1.7rem, 7.5vw, 2.2rem); }
  .timeline-chapter, .agent-section, .ai-view-section { padding-left: 22px; }
  .timeline-chapter-head { margin-left: -23px; }
  .agent-section { padding-left: 0; }
  .rank-row { grid-template-columns: 110px 1fr; }
  .rank-count { display: none; }
  .rank-note { margin-right: 0; }
  .where-row, .agent-field { grid-template-columns: 1fr; gap: 2px; }
}

/* ============ 打印 ============ */
@media print {
  body { background: #fff; }
  .nav, .rail, .reveal, .skip-link { display: none; }
  main { padding: 0; }
  a { color: inherit; }
  .timeline-chapter { border-left: none; padding-left: 0; }
  .timeline-chapter-head { margin-left: 0; }
}

__BODY__

<script>
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!reduce) {
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.08 });
    document.querySelectorAll('.reveal').forEach(function(el){ io.observe(el); });
  } else {
    document.querySelectorAll('.reveal').forEach(function(el){ el.classList.add('in'); });
  }

  var links = document.querySelectorAll('.nav-links a, .rail-nav a');
  var ids = ['sec-portrait','sec-lines','sec-promises','sec-insights','sec-ai-eyes','sec-wrapped'];
  var secs = ids.map(function(id){ return document.getElementById(id); });
  function current(){
    var pos = window.scrollY + window.innerHeight * 0.42;
    var idx = 0;
    secs.forEach(function(s, i){ if (s && s.getBoundingClientRect().top + window.scrollY <= pos) idx = i; });
    links.forEach(function(a, i){ if (i === idx) a.setAttribute('aria-current','true'); else a.removeAttribute('aria-current'); });
  }
  var ticking = false;
  window.addEventListener('scroll', function(){
    if (!ticking) { requestAnimationFrame(function(){ current(); ticking = false; }); ticking = true; }
  }, { passive: true });
  window.addEventListener('resize', current);
  current();
})();
</script>
